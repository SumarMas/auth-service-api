spring:
  application:
    name: auth-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

security:
  jwt:
    issuer: auth-service
    secret: "change-this-in-prod-64chars-minimum______________________________"
    expiration-seconds: 3600 # (1 hour)

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}, spanId=%X{spanId:-}]"
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG   # si querés ver queries SQL

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

pool:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8082}